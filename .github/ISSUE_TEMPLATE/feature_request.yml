name: 功能建议
description: 建议新的能力、流程调整或兼容性改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先说明实际问题，再描述建议方案。不要提交未公开专利资料、账号凭据或个人信息。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前工作流在哪个场景下无法满足需要
      placeholder: 当我执行……时，目前只能……
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述用户可以观察到的结果，不必预先限定实现方式
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 核心专利 Skill
        - Domain Runtime 或状态机
        - 安装与发行
        - 文档与贡献流程
        - Vendored 支撑 Skill
        - 不确定
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如果已有实现设想，请说明接口、流程或交互变化

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明当前可用的绕行方式，以及它为什么不足

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与约束
      description: 说明是否涉及 Skill slug、状态结构、Gate、发行格式、第三方来源或许可证

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已删除未公开专利资料、账号凭据和个人信息
          required: true
