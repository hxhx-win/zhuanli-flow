name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check release inputs
        run: python -B scripts/check-release.py
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
      - name: Build release package
        run: python -B scripts/build-release.py
