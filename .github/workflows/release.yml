name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tag and version
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $expected" >&2
            exit 1
          fi
      - name: Check release inputs
        run: python -B scripts/check-release.py
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
      - name: Build release package
        run: python -B scripts/build-release.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
